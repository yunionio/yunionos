name: Release yunionos to Docker Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag / version (e.g. v4.1.0-20261020.0)"
        required: true
        type: string

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build-rootfs:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            make_target: docker-buildroot
            output_dir: output
          - arch: aarch64
            make_target: docker-buildroot-arm64
            output_dir: output_arm64
          - arch: riscv64
            make_target: docker-buildroot-riscv64
            output_dir: output_riscv64
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h

      - uses: actions/checkout@v4

      - name: Build rootfs (${{ matrix.arch }})
        run: make ${{ matrix.make_target }}

      - name: Upload rootfs.tar
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: ${{ matrix.output_dir }}/images/rootfs.tar
          if-no-files-found: error
          retention-days: 3

  bundle-and-push:
    needs: [resolve-version, build-rootfs]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h

      - uses: actions/checkout@v4

      - name: Download rootfs artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rootfs-*
          path: /tmp/rootfs-artifacts

      - name: Place rootfs.tar files
        run: |
          set -euo pipefail
          mkdir -p output/images output_arm64/images output_riscv64/images
          cp /tmp/rootfs-artifacts/rootfs-amd64/rootfs.tar output/images/rootfs.tar
          cp /tmp/rootfs-artifacts/rootfs-aarch64/rootfs.tar output_arm64/images/rootfs.tar
          cp /tmp/rootfs-artifacts/rootfs-riscv64/rootfs.tar output_riscv64/images/rootfs.tar
          ls -lh output/images/rootfs.tar output_arm64/images/rootfs.tar output_riscv64/images/rootfs.tar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bundle all architectures (BM + VM)
        run: make docker-bundle-all

      - name: Push yunionos images
        env:
          TAG: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Pushing docker.io/${DOCKERHUB_NAMESPACE}/yunionos:${TAG} and ${TAG}-vm"
          make docker-yunionos-image \
            REGISTRY="docker.io/${DOCKERHUB_NAMESPACE}" \
            YUNIONOS_VERSION="${TAG}"
          make docker-yunionos-image-vm \
            REGISTRY="docker.io/${DOCKERHUB_NAMESPACE}" \
            YUNIONOS_VERSION="${TAG}"
